<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Opened by double-clicking (file://)? This page needs a server, so hand off to the
      // self-contained offline build (created by `npm run build`). Served pages are unaffected.
      (function () {
        if (location.protocol !== 'file:') return;
        var path = location.pathname;
        if (/\/dist-offline\/index\.html$/.test(path)) return;
        var target = /\/dist\/index\.html$/.test(path) ? '../dist-offline/index.html' : 'dist-offline/index.html';
        location.replace(target + location.hash);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8FAFC" />
