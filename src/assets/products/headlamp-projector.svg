<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Temporary illustrative rendering (Nexxol Media demo). Not a real product. -->
  <defs>
    <filter id="soft" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3f6"/>
      <stop offset=".4" stop-color="#c2ced7"/>
      <stop offset="1" stop-color="#7a8b99"/>
    </linearGradient>
    <linearGradient id="cavity" x1="0" y1="0" x2=".25" y2="1">
      <stop offset="0" stop-color="#31485c"/>
      <stop offset=".5" stop-color="#1b2c3b"/>
      <stop offset="1" stop-color="#0e1923"/>
    </linearGradient>
    <radialGradient id="bowl" cx=".42" cy=".38" r=".64">
      <stop offset="0" stop-color="#f6f9fb"/>
      <stop offset=".3" stop-color="#cdd8e0"/>
      <stop offset=".62" stop-color="#7a8d9d"/>
      <stop offset="1" stop-color="#1f3245" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#93a5b3"/>
      <stop offset="1" stop-color="#e6edf1"/>
    </linearGradient>
    <radialGradient id="lens" cx=".36" cy=".32" r=".74">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".2" stop-color="#eef6fb"/>
      <stop offset=".48" stop-color="#b3cfe0"/>
      <stop offset=".78" stop-color="#4f6e86"/>
      <stop offset="1" stop-color="#172b3b"/>
    </radialGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#e8f2f8" stop-opacity=".4"/>
      <stop offset="1" stop-color="#c9e7f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2cf9f"/>
      <stop offset=".45" stop-color="#d99338"/>
      <stop offset="1" stop-color="#9c611b"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fa1af"/>
      <stop offset=".5" stop-color="#f4f7f9"/>
      <stop offset="1" stop-color="#8fa1af"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".3"/>
      <stop offset=".32" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset=".7" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#c9e7f7" stop-opacity=".1"/>
    </linearGradient>
    <pattern id="rib" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)">
      <rect width="7" height="7" fill="none"/>
      <rect width="2" height="7" fill="#ffffff" opacity=".22"/>
    </pattern>
    <clipPath id="inner">
      <path d="M104 330C104 258 150 214 232 207L560 183C634 178 690 176 708 188C718 196 712 212 698 224L588 318C552 350 514 370 458 382L222 430C152 443 104 408 104 330Z"/>
    </clipPath>
  </defs>

  <ellipse cx="400" cy="486" rx="300" ry="20" fill="#172a3a" opacity=".24" filter="url(#soft)"/>

  <!-- mounting tabs -->
  <path d="M286 200l4-28h40l6 26z" fill="#a4b3bf"/>
  <path d="M606 172l4-24h34l4 24z" fill="#a4b3bf"/>
  <path d="M332 438l-2 34h40l6-40z" fill="#8c9dab"/>

  <!-- shell -->
  <path d="M88 330C88 250 140 200 230 192L560 168C640 162 700 160 724 176C740 188 732 214 712 232L600 330C560 366 520 386 460 398L220 446C140 460 88 420 88 330Z" fill="url(#shell)"/>
  <path d="M96 290C112 228 160 200 230 192L560 168C640 162 700 160 724 176" fill="none" stroke="#ffffff" stroke-opacity=".9" stroke-width="2"/>

  <!-- cavity -->
  <path d="M104 330C104 258 150 214 232 207L560 183C634 178 690 176 708 188C718 196 712 212 698 224L588 318C552 350 514 370 458 382L222 430C152 443 104 408 104 330Z" fill="url(#cavity)"/>

  <g clip-path="url(#inner)">
    <!-- amber signal cell in the tapered inner tip -->
    <path d="M548 226L700 206L604 292C584 310 562 320 540 326Z" fill="url(#amber)"/>
    <path d="M548 226L700 206L604 292C584 310 562 320 540 326Z" fill="url(#rib)"/>
    <path d="M548 226L700 206L604 292C584 310 562 320 540 326Z" fill="none" stroke="url(#chrome)" stroke-width="3"/>

    <!-- high-beam module -->
    <circle cx="436" cy="296" r="96" fill="url(#bowl)"/>
    <circle cx="436" cy="296" r="60" fill="#0b151e"/>
    <circle cx="436" cy="296" r="56" fill="none" stroke="url(#ring)" stroke-width="4"/>
    <circle cx="436" cy="296" r="46" fill="url(#lens)"/>
    <circle cx="436" cy="296" r="34" fill="none" stroke="#ffffff" stroke-opacity=".26" stroke-width="1.4"/>
    <circle cx="436" cy="296" r="22" fill="url(#core)"/>
    <ellipse cx="420" cy="276" rx="15" ry="7" transform="rotate(-32 420 276)" fill="#ffffff" opacity=".92"/>

    <!-- low-beam module -->
    <circle cx="246" cy="322" r="132" fill="url(#bowl)"/>
    <circle cx="246" cy="322" r="86" fill="#0b151e"/>
    <circle cx="246" cy="322" r="81" fill="none" stroke="url(#ring)" stroke-width="5"/>
    <circle cx="246" cy="322" r="68" fill="url(#lens)"/>
    <circle cx="246" cy="322" r="52" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="1.5"/>
    <circle cx="246" cy="322" r="34" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="1"/>
    <circle cx="246" cy="322" r="30" fill="url(#core)"/>
    <ellipse cx="222" cy="291" rx="23" ry="10" transform="rotate(-32 222 291)" fill="#ffffff" opacity=".94"/>
    <circle cx="280" cy="356" r="4.5" fill="#ffffff" opacity=".55"/>

    <!-- chrome accent below modules -->
    <path d="M150 412L520 352" stroke="url(#chrome)" stroke-width="3" stroke-linecap="round" opacity=".8"/>

    <!-- DRL eyebrow light guide -->
    <path d="M690 200C640 198 600 198 560 201L252 224C172 232 124 272 122 340" fill="none" stroke="#c9e7f7" stroke-width="24" stroke-linecap="round" opacity=".5" filter="url(#glow)"/>
    <path d="M690 200C640 198 600 198 560 201L252 224C172 232 124 272 122 340" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

    <!-- outer clear lens -->
    <rect width="800" height="600" fill="url(#glass)"/>
    <path d="M140 262C200 222 380 206 660 186" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity=".5"/>
    <path d="M160 300C210 250 300 236 420 228" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity=".08"/>
  </g>

  <path d="M104 330C104 258 150 214 232 207L560 183C634 178 690 176 708 188C718 196 712 212 698 224L588 318C552 350 514 370 458 382L222 430C152 443 104 408 104 330Z" fill="none" stroke="#0a141c" stroke-opacity=".55" stroke-width="2"/>
</svg>
